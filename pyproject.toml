[project]
name = "dmm-release"
version = "0.1.0"
description = "DMM training and reproducible MAPF evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=0.27,<2",
    "ninja>=1.11,<2",
    "numpy==1.26.4",
    "torch==2.13.0+cu126",
]

[dependency-groups]
train = [
    "loguru>=0.7,<1",
    "pyarrow>=17,<24",
    "pyyaml>=6,<7",
    "tensorboard>=2.18,<3",
]
logging = ["wandb>=0.19,<1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
